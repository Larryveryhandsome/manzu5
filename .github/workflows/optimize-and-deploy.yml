name: Optimize Images and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Optimize Images
      uses: calibreapp/image-actions@main
      with:
        githubToken: ${{ secrets.GITHUB_TOKEN }}
        jpegQuality: '80'
        pngQuality: '80'
        webpQuality: '80'
        ignorePaths: 'node_modules/**,build/**,dist/**'
    
    - name: Cache images
      uses: actions/cache@v3
      with:
        path: |
          images
          thumbnails
        key: ${{ runner.os }}-images-${{ hashFiles('**/*.{png,jpg,jpeg}') }}
        restore-keys: |
          ${{ runner.os }}-images-
    
    - name: Setup Pages
      uses: actions/configure-pages@v3
    
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v1
      with:
        path: '.'
    
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2
